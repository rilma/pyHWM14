[build-system]
requires = ["scikit-build-core", "numpy", "meson", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "pyhwm2014"
description = "HWM14 neutral winds model"
readme = "README.rst"
requires-python = ">=3.12"
dynamic = ["version"]
license = {text = "MIT"}
authors = [
    {name = "Ronald Ilma", email = "rilma@example.com"}
]
keywords = ["HWM14", "wind model", "atmospheric science"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.23",
    "timeutil",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "seaborn>=0.12"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
    "black>=23.12",
    "pre-commit>=3.0",
    "pip-audit>=2.0",
]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]
all = ["pyhwm2014[plot,dev,docs]"]

[project.urls]
"Homepage" = "https://github.com/rilma/pyHWM14"
"Bug Tracker" = "https://github.com/rilma/pyHWM14/issues"
"Documentation" = "https://github.com/rilma/pyHWM14/blob/main/README.rst"
"Changelog" = "https://github.com/rilma/pyHWM14/blob/main/CHANGELOG.md"
"Contributing" = "https://github.com/rilma/pyHWM14/blob/main/CONTRIBUTING.md"
"Discussions" = "https://github.com/rilma/pyHWM14/discussions"
"Roadmap" = "https://github.com/rilma/pyHWM14/blob/main/ROADMAP.md"
"Repository" = "https://github.com/rilma/pyHWM14"

[tool.scikit-build]
cmake.version = ">=3.15"
cmake.build-type = "Release"
wheel.packages = ["pyhwm2014"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "mpl_toolkits.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # Line too long (black handles this)

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["F841", "B006", "B007"]
"tests/test_core.py" = ["UP038"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.coverage.run]
branch = true
source = ["pyhwm2014"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
