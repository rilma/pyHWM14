name: pyHWM14 Repository CI Workflow

on:
  push:
    branches: [ main ]
    tags:
      - v*.*.*
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff mypy numpy timeutil
    - name: Run ruff check
      run: ruff check pyhwm2014 tests
    - name: Run ruff format check
      run: ruff format --check pyhwm2014 tests
    - name: Run mypy type checking
      run: mypy pyhwm2014

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install scikit-build-core cmake ninja numpy meson pytest pytest-cov
    - name: Build and install package
      run: |
        pip install -e .
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ -v --tb=short --cov=pyhwm2014 --cov-report=term-missing --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade "pip>=26.1"
        python -m pip install pip-audit
    - name: Run pip-audit
      run: pip-audit
